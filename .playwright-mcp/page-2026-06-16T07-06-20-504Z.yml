      - generic [ref=e42]:
        - heading "The Problem" [level=2] [ref=e43]
        - paragraph [ref=e44]: Meeting notes are unstructured. Critical decisions get lost in the audio. Actionable items are scattered across transcripts and chat logs. Teams waste time extracting insights from hours of recordings when they should be shipping.
      - generic [ref=e47]:
        - heading "Agent Swarm Architecture" [level=2] [ref=e48]
        - paragraph [ref=e49]: "WorkflowOS deploys a fleet of specialized agents that work in parallel:"
      - generic [ref=e52]:
        - paragraph [ref=e53]:
          - strong [ref=e54]: Data Analyst Agent
          - text: "— Extracts structured data: attendees, decisions, action items, blockers. Cleans noisy transcripts."
        - paragraph [ref=e55]:
          - strong [ref=e56]: Strategist Agent
          - text: — Identifies opportunities, dependencies, and roadmap implications from decisions. Market-aware planning.
        - paragraph [ref=e57]:
          - strong [ref=e58]: Security Audit Agent
          - text: — Flags compliance risks, credential leaks, governance issues. Cross-project constraint checking.
        - paragraph [ref=e59]:
          - strong [ref=e60]: Copywriter Agent
          - text: — Crafts polished, actionable narratives from raw data. Executive-ready summaries.
        - paragraph [ref=e61]:
          - strong [ref=e62]: Reporter Agent
          - text: — Synthesises all findings and generates the final execution plan with priority ranking and timeline.
      - generic [ref=e65]:
        - heading "Technical Stack" [level=2] [ref=e66]
        - paragraph [ref=e67]:
          - strong [ref=e68]: "Backend:"
          - text: Python FastAPI running on Azure Web Apps with Azure OpenAI LLM inference (GPT-4). Parallel asyncio orchestration with task queuing.
        - paragraph [ref=e69]:
          - strong [ref=e70]: "Frontend:"
          - text: Next.js 14 deployed on Vercel. Real-time execution dashboard using Server-Sent Events (SSE) for live agent logs.
        - paragraph [ref=e71]:
          - strong [ref=e72]: "Infrastructure:"
          - text: GitHub Actions CI/CD pipelines. Container-ready deployment. Cross-meeting memory for context retention and dependency tracking.
